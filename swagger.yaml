basePath: /
consumes:
    - application/json
definitions:
    Product:
        properties:
            description:
                description: Description of the product
                example: Frothy milky coffee
                type: string
                x-go-name: Description
            id:
                description: ID of the product
                example: 1
                format: int64
                type: integer
                x-go-name: ID
            name:
                description: Name of the product
                example: Latte
                type: string
                x-go-name: Name
            price:
                description: Price of the product (must be greater than 0)
                example: 2.45
                format: float
                type: number
                x-go-name: Price
            sku:
                description: 'SKU code (format: abc-123-xyz)'
                example: abc-323-abc
                type: string
                x-go-name: SKU
        required:
            - name
            - price
            - sku
        type: object
        x-go-package: github.com/VINAYAK777CODER/PRODUCT-API/data
    Products:
        items:
            $ref: '#/definitions/Product'
        type: array
        x-go-package: github.com/VINAYAK777CODER/PRODUCT-API/data
info:
    description: Documentation for Product API
    title: of Product API
    version: 1.0.0
paths:
    /products:
        get:
            description: This endpoint returns the complete list of products available in the system.
            operationId: listProducts
            responses:
                "200":
                    $ref: '#/responses/productsResponse'
            summary: Get all products
            tags:
                - products
        post:
            description: This endpoint creates a new product using JSON data sent in the request body.
            operationId: addProduct
            responses:
                "201":
                    $ref: '#/responses/productAddSuccess'
                "400":
                    $ref: '#/responses/productAddValidationError'
            summary: Add a new product
            tags:
                - products
    /products/{id}:
        delete:
            description: This endpoint removes the product with the provided ID from the system.
            operationId: deleteProduct
            parameters:
                - description: Product ID to delete
                  example: 1
                  format: int64
                  in: path
                  minimum: 1
                  name: id
                  required: true
                  type: integer
                  x-go-name: ID
            responses:
                "200":
                    $ref: '#/responses/deleteProductResponse'
                "400":
                    $ref: '#/responses/deleteProductError'
                "404":
                    $ref: '#/responses/deleteProductNotFound'
                "500":
                    $ref: '#/responses/deleteProductError'
            summary: Delete a product by ID
            tags:
                - products
        put:
            description: |-
                This endpoint updates a product that already exists in the system.
                It requires a valid numeric ID in the URL and a valid JSON body.
            operationId: updateProduct
            parameters:
                - in: path
                  name: id
                  required: true
                  type: integer
            responses:
                "200":
                    $ref: '#/responses/productUpdateSuccess'
                "400":
                    $ref: '#/responses/productUpdateValidationError'
                "404":
                    $ref: '#/responses/productUpdateNotFound'
                "500":
                    $ref: '#/responses/productUpdateServerError'
            summary: Update an existing product by its ID.
            tags:
                - products
produces:
    - application/json
responses:
    deleteProductError:
        description: Error response (invalid id / internal)
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    deleteProductNotFound:
        description: Error response (not found)
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    deleteProductResponse:
        description: Successful delete response
        schema:
            properties:
                id:
                    format: int64
                    type: integer
                    x-go-name: ID
                message:
                    type: string
                    x-go-name: Message
            type: object
    productAddBadRequest:
        description: ""
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    productAddSuccess:
        description: ""
        schema:
            properties:
                data:
                    $ref: '#/definitions/Product'
                message:
                    type: string
                    x-go-name: Message
            type: object
    productAddValidationError:
        description: ""
        schema:
            properties:
                validation_error:
                    type: string
                    x-go-name: ValidationError
            type: object
    productUpdateBadRequest:
        description: ""
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    productUpdateNotFound:
        description: ""
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    productUpdateServerError:
        description: ""
        schema:
            properties:
                error:
                    type: string
                    x-go-name: Error
            type: object
    productUpdateSuccess:
        description: ""
        schema:
            properties:
                message:
                    type: string
                    x-go-name: Message
            type: object
    productUpdateValidationError:
        description: ""
        schema:
            properties:
                validation_error:
                    type: string
                    x-go-name: ValidationError
            type: object
    productsResponse:
        description: ListProductsResponse represents the response for GET /products
        schema:
            items:
                $ref: '#/definitions/Product'
            type: array
schemes:
    - http
swagger: "2.0"
